name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check secrets are populated
        env:
          NPM: ${{ secrets.NPM_TOKEN }}
          GH: ${{ secrets.GH_TOKEN }}
        run: |
          echo "NPM_TOKEN length: ${#NPM}"
          echo "GH_TOKEN length: ${#GH}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm semantic-release
